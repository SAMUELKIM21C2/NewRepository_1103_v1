<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>M365 Copilot 2차시 실습 교재</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 위쪽 고정 막대(트랙 전환·지금 구간·쪽 이동) + 왼쪽 Part 목록 + 가운데 교재 본문(읽기 폭 880px). 경희 크림슨은 강조에만 */
:root {
  --bg: #F4F5F8; --surface: #FFFFFF; --sunken: #EEF0F4; --ink: #172238; --ink2: #3D475E; --muted: #636C80; --line: #DCE0E7; --line2: #C9CED8;
  --accent: #A10F1B; --accent-ink: #FFFFFF; --accent-soft: #F7E7E9; --mark: #C9560F; --mark-soft: #FCEADB;
  --ok: #1E7A4C; --ok-soft: #E2F2E9; --mid: #9A6200; --mid-soft: #FBF0DA; --bad: #B3261E; --bad-soft: #FBE7E5;
  --shadow: 0 1px 2px rgba(23, 34, 56, .06), 0 4px 14px rgba(23, 34, 56, .05);
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-disp: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --f-code: "Nanum Gothic Coding", "D2Coding", ui-monospace, "Consolas", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E121A; --surface: #161C27; --sunken: #1C2330; --ink: #E7EAF1; --ink2: #C3C9D5; --muted: #929BAE; --line: #2A3244; --line2: #384257;
    --accent: #E9616B; --accent-ink: #1A0A0C; --accent-soft: #3A1C22; --mark: #F0965A; --mark-soft: #3B2718;
    --ok: #63C493; --ok-soft: #173225; --mid: #E6B354; --mid-soft: #382B12; --bad: #F08A82; --bad-soft: #3A1B19;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E121A; --surface: #161C27; --sunken: #1C2330; --ink: #E7EAF1; --ink2: #C3C9D5; --muted: #929BAE; --line: #2A3244; --line2: #384257;
  --accent: #E9616B; --accent-ink: #1A0A0C; --accent-soft: #3A1C22; --mark: #F0965A; --mark-soft: #3B2718;
  --ok: #63C493; --ok-soft: #173225; --mid: #E6B354; --mid-soft: #382B12; --bad: #F08A82; --bad-soft: #3A1B19;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 120px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 위쪽 막대 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topin { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; line-height: 1.2; text-decoration: none; min-width: 0; }
.brand b { font-family: var(--f-disp); font-weight: 800; font-size: 17px; color: var(--accent); letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: 11.5px; }
.tswrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tswrap > span { font-size: 12px; color: var(--muted); white-space: nowrap; letter-spacing: .02em; }
.tsw { display: flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tsw button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.tsw button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.tsw button:hover:not([aria-pressed="true"]) { background: var(--surface); }
.now { margin-left: auto; display: flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px; min-width: 0; text-align: left; }
.now .nlab { color: var(--accent); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.now b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now small { color: var(--muted); white-space: nowrap; }
.jump { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.jump input { width: 58px; padding: 5px 8px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); font-variant-numeric: tabular-nums; }
.jump button { border: 1px solid var(--line2); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.strip { display: none; gap: 6px; overflow-x: auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); scrollbar-width: none; }
.strip a { white-space: nowrap; text-decoration: none; font-size: 13px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
.strip a.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }

/* 본문 틀 */
.layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 32px; max-width: 1220px; margin: 0 auto; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { position: sticky; top: 92px; align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; display: flex; flex-direction: column; gap: 22px; font-size: 13.5px; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav a { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink2); }
.rail nav a:hover { background: var(--surface); }
.rail nav a.on { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.rno { font-family: var(--f-disp); font-weight: 800; color: var(--accent); width: 14px; text-align: center; line-height: 1.5; }
.rt { display: flex; flex-direction: column; line-height: 1.35; }
.rt b { font-weight: 600; }
.rt small { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rail-outs { display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--line); padding-top: 14px; }
.rail-outs > b { font-size: 12px; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
.rail-outs a { display: flex; gap: 6px; text-decoration: none; color: var(--ink2); font-size: 12.5px; line-height: 1.4; padding: 3px 4px; border-radius: 6px; }
.rail-outs a span { color: var(--muted); width: 16px; flex: none; }
.rail-outs a.min span { color: var(--accent); font-weight: 700; }
.rail-outs a.done { color: var(--ok); }
.rail-outs a.done span::after { content: " ✓"; }
.rail-outs small { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
main { min-width: 0; max-width: 880px; display: flex; flex-direction: column; gap: 22px; }

/* 첫 화면 */
.hero { padding: 12px 0 6px; }
.eyebrow { font-size: 12.5px; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
.hero h1 { font-family: var(--f-disp); font-weight: 800; font-size: clamp(30px, 4.6vw, 44px); line-height: 1.22; letter-spacing: -.02em; margin: 10px 0 12px; }
.hero .sub { color: var(--ink2); max-width: 62ch; }
.phead-part { padding: 6px 0 2px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.pno { font-size: 12.5px; letter-spacing: .12em; color: var(--accent); font-weight: 700; }
.phead-part h2 { font-family: var(--f-disp); font-weight: 800; font-size: clamp(26px, 3.6vw, 34px); letter-spacing: -.02em; margin: 4px 0 4px; }
.phead-part p { color: var(--muted); font-variant-numeric: tabular-nums; }
.pouts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* 블록 */
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 110px; transition: box-shadow .4s; }
.block.flash { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.bhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bhead h3 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; flex: 1 1 260px; }
.role { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 4px; background: var(--sunken); color: var(--ink2); white-space: nowrap; }
.role-p { background: var(--accent); color: var(--accent-ink); }
.role-c { background: var(--ink); color: var(--surface); }
.role-s { background: var(--mark-soft); color: var(--mark); }
.role-x { background: var(--sunken); color: var(--muted); border: 1px dashed var(--line2); }
.ptag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.lead { color: var(--accent); font-weight: 600; font-size: 14.5px; }
.block h4 { font-size: 15px; font-weight: 700; margin-top: 4px; }
.hint { color: var(--muted); font-size: 13px; }
.cap, .cap-top { color: var(--muted); font-size: 12.5px; }
.cap-top { font-weight: 600; color: var(--ink2); }
.cap.end { margin-top: 8px; }
.minline { font-weight: 700; color: var(--accent); font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--sunken); color: var(--ink2); }
.pill.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
.grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.tips > div b, .notes2 b, .envs b { display: block; font-size: 14px; margin-bottom: 2px; }
.tips > div p, .notes2 p, .envs p { font-size: 13.5px; color: var(--ink2); }
.notes2 p, .envs p { background: var(--sunken); border-radius: 8px; padding: 10px 12px; }
.callout { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.callout b { color: var(--accent); }
.callout ol { margin: 6px 0; padding-left: 20px; }
.callout.q { background: var(--mark-soft); }
.callout.q b { color: var(--mark); }
.rule code { font-family: var(--f-code); background: var(--sunken); padding: 4px 8px; border-radius: 6px; font-size: 13.5px; }
details.more { border-top: 1px dashed var(--line2); padding-top: 10px; }
details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink2); }
details.more[open] summary { margin-bottom: 10px; }
.closing { background: var(--ink); color: var(--surface); border-radius: var(--r); padding: 18px 22px; }
.closing b { font-family: var(--f-disp); font-size: 18px; }

/* 표 */
.tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
thead th { background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; white-space: nowrap; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
td.rh, th.rh { font-weight: 600; background: var(--sunken); color: var(--ink); white-space: normal; min-width: 7.5em; }
th.rh small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
td { font-variant-numeric: tabular-nums; }
table.form td { padding: 4px; }
table.form textarea, table.form select { width: 100%; min-width: 9em; border: 1px solid transparent; background: var(--bg); border-radius: 6px; padding: 6px 8px; resize: vertical; font-size: 13.5px; }
table.form textarea:focus, table.form select:focus { border-color: var(--accent); background: var(--surface); outline: none; }
table.form td.ro { font-size: 12.5px; color: var(--ink2); min-width: 15em; max-width: 20em; }
table.ws td.ex { font-size: 12.5px; color: var(--muted); min-width: 14em; max-width: 22em; }
table.ws td.ex span { display: block; margin-bottom: 4px; }
table.ws textarea { min-width: 14em; }
table.sum textarea { min-width: 18em; }
table.trec textarea { min-width: 10em; }
table.a2 td:last-child { white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); padding: 7px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--ink2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.xs { padding: 2px 8px; font-size: 12px; font-weight: 500; }
.btn.done { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.armed { border-color: var(--mark); color: var(--mark); }
.btn svg { width: 16px; height: 16px; }
body.no-dl .dl-only { display: none; }

/* 프롬프트 상자 */
.prompt { border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; background: var(--sunken); }
.prompt + .prompt { margin-top: 2px; }
.phead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pid { font-family: var(--f-code); font-weight: 700; background: var(--ink); color: var(--surface); padding: 1px 8px; border-radius: 5px; font-size: 13px; }
.ptitle { font-weight: 700; font-size: 14px; }
.ptrack { margin-left: auto; font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.pedited { font-size: 12px; color: var(--mark); background: var(--mark-soft); padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.pwhere { font-size: 12.5px; color: var(--muted); padding: 8px 12px 0; }
.pwhere b { color: var(--ink2); margin-right: 4px; }
.pbody { margin: 0; padding: 10px 14px 12px; font-family: var(--f-code); font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; overflow-wrap: anywhere; color: var(--ink); max-height: 520px; overflow-y: auto; }
.pedit { display: block; width: calc(100% - 20px); margin: 10px; min-height: 180px; font-family: var(--f-code); font-size: 13.5px; line-height: 1.7; border: 1px solid var(--accent); border-radius: 8px; padding: 10px; background: var(--surface); resize: vertical; }
mark.ph { background: var(--mark-soft); color: var(--mark); font-weight: 700; border-radius: 3px; padding: 0 2px; }
.pbar { display: flex; align-items: center; gap: 8px; padding: 0 12px 12px; flex-wrap: wrap; }
.pcount { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pcount.over { color: var(--bad); font-weight: 700; }
.prompt.compact .pbody { padding-block: 8px; }

/* 입력 */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink2); }
.field input, .field textarea, select { width: 100%; border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; background: var(--surface); font-size: 14px; }
.field textarea { resize: vertical; }
.field input:focus, .field textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.help { font-size: 12px; color: var(--muted); }
.checks { display: flex; flex-direction: column; gap: 6px; }
.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px; padding: 6px 10px; border-radius: 8px; background: var(--bg); }
.chk input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.radios { display: flex; flex-wrap: wrap; gap: 8px; }
.rad { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; background: var(--surface); }
.rad input { accent-color: var(--accent); }
.rad:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.builder { display: flex; flex-direction: column; gap: 12px; }
.bform { background: var(--bg); padding: 12px; border-radius: 8px; }

/* 트랙 카드 */
.tcards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tcard { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line2); border-radius: 10px; padding: 12px; cursor: pointer; background: var(--surface); position: relative; }
.tcard input { position: absolute; opacity: 0; }
.tcard b { font-size: 16px; }
.tcard span { font-size: 12.5px; color: var(--ink2); line-height: 1.45; }
.tcard em { font-style: normal; font-size: 12px; color: var(--muted); }
.tcard.on, .tcard:has(input:checked) { border: 2px solid var(--accent); padding: 11px; background: var(--accent-soft); }
.tcard.on b { color: var(--accent); }
.tcard:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 학습목표·결과물 */
.goals { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; counter-reset: g; }
.goals li { counter-increment: g; display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.goals li::before { content: counter(g); grid-row: span 2; font-family: var(--f-disp); font-weight: 800; color: var(--accent); font-size: 22px; line-height: 1.1; }
.goals b { font-size: 14.5px; }
.goals span { font-size: 13px; color: var(--ink2); }
.outs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.out { display: flex; flex-direction: column; gap: 2px; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); position: relative; }
.out.min { border: 2px solid var(--accent); padding: 9px 11px; }
.out .on { font-size: 20px; color: var(--accent); line-height: 1; }
.out b { font-size: 14px; }
.out .seg { font-size: 12px; color: var(--muted); }
.out .st { position: absolute; top: 8px; right: 10px; font-size: 11.5px; color: var(--ok); font-weight: 700; }
.out.done { background: var(--ok-soft); }

/* 하루 지도 */
.map { display: flex; flex-direction: column; gap: 10px; }
.mrow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: stretch; }
.mlab { font-weight: 700; display: flex; flex-direction: column; justify-content: center; font-size: 14px; }
.mlab small { font-weight: 400; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.mbar { display: flex; gap: 3px; position: relative; min-height: 70px; }
.mseg { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; text-decoration: none; background: var(--accent-soft); border-radius: 6px; padding: 6px 7px; overflow: hidden; }
.mseg b { font-size: 13px; color: var(--accent); }
.mseg span { font-size: 11.5px; line-height: 1.3; color: var(--ink2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  P8: { title: '지침(안내 칸)', where: '구성 화면의 안내 칸(최대 8,000자) · 마지막 # 참고 자료는 경로 B(업로드 불가)·모의 대화에서만 채운다', text: {
    mkt: `# 역할
당신은 '새봄 문의 분류 도우미'입니다. 새봄스페이스 고객지원팀의 친절하고 정확한 선배처럼, 인턴이 고객 문의를 분류하고 답변 초안을 쓰도록 돕습니다.
# 목표
업로드된 운영 기준과 문의 목록을 근거로 문의의 유형·긴급도를 정하고, 근거가 분명한 3문장 이내 답변 초안과 담당자 확인 사항을 정리합니다.
# 처리 단계
1. 문의에서 고객이 원하는 것(핵심 요청)을 한 줄로 요약합니다.
2. 유형을 예약·변경 / 취소·환불 / 요금·할인 / 시설·비품 / 불만·제안 / 기타 중 하나로 정합니다.
3. 긴급도를 정합니다. 당일 이용과 관련되면 높음, 그 밖에는 보통 또는 낮음입니다.
4. 운영 기준에서 근거 항목을 찾아 답변 초안을 3문장 이내로 씁니다.
5. 사용자가 말한 횟수·요금·날짜는 운영 기준과 대조하고, 다르면 바로잡은 뒤 답합니다.
# 응답 형식
- 표: 유형 | 긴급도 | 핵심 요청 | 답변 초안 | 근거 항목 | 담당자 확인 필요 사항
- 여러 건이면 한 줄에 한 건씩, 긴급도가 높은 것부터
- 존댓말, 친절하고 짧은 문장
# 출처와 모르는 내용 처리
- 모든 답변 초안에 근거 항목 이름(예: 운영 기준 4. 취소·환불)을 적습니다.

- 환불·보상·예외를 약속하지 않습니다. "담당자 확인 후 안내드리겠습니다"로 씁니다.
- 고객 이름, 연락처 같은 개인정보를 요청하거나 보여 주지 않습니다.
- 운영 기준에 없는 할인·혜택·시설 정보를 만들지 않습니다.
- 고객에게 직접 답장하거나 게시하지 않습니다. 초안만 보여 주고 사용자가 직접 보내도록 안내합니다.

업무와 관계없는 질문에는 "이 도우미는 새봄스페이스 고객 문의 분류와 답변 초안만 돕습니다"라고 짧게 답합니다.

    plan: `# 역할

  function imageTxt() {
    const mine = buildBrief(); const lines = [`③ 사용 프롬프트 — ${meta()}`, '', '[생성 프롬프트]', mine, '', '[수정 프롬프트]', curPrompt('P6'), '', '[수정 기록]'];
    ['목적에 맞나?', '비율이 용도에 맞나?', '오해할 요소가 없나?', '바꾼 점과 사용한 수정 프롬프트'].forEach((q, i) => lines.push(`- ${q} 수정 전: ${cellv(`brec_${i}_0`)} / 수정 후: ${cellv(`brec_${i}_1`)}`));
    lines.push('', `[표시 문구] AI 생성 이미지(Microsoft Copilot), 생성일 ${val('bdate') || 'YYYY-MM-DD'}, 프롬프트 요약: ${BRIEF[TR][0]}`);
    return lines.join('\n');
  }
  function knowDoc(k) {
    if (k === 'k64') return { fn: '새봄_운영기준.docx', doc: { title: '새봄스페이스 운영 기준', meta: '교육용 가상 자료 · 시범 운영판 · 작성 운영기획팀(가상) · 기준일 2026-11-13', blocks: DOC_64.split('\n').slice(3).filter((l) => l.trim()).map((l) => (/^\d\./.test(l) ? { h: l } : { p: l })) } };
    if (k === 'k61') return { fn: '새봄_요청메일.docx', doc: { title: '요청 메일·제안요청서 요약·변경 메일', meta: '교육용 가상 자료(표 6-1)', blocks: DOC_61.split('\n\n').map((p) => ({ p })) } };
    return { fn: '새봄_문의목록.docx', doc: { title: '고객 문의 목록(10건)', meta: '교육용 가상 자료(표 6-5) · 이름·연락처 없음', blocks: [{ table: { cols: A2DATA.mkt.cols.slice(0, 3), rows: A2DATA.mkt.rows.map((r) => r.slice(0, 3)), widths: [0.1, 0.2, 0.7] } }] } };
  }

  let DL = null; // null = 확인 전, false = 사용 불가, object = downloads 기능
  const inViewer = !!(window.claude && typeof window.claude.use === 'function');
  if (inViewer) {
    window.claude.use('downloads').then((d) => { DL = d || false; document.body.classList.toggle('no-dl', !d); }).catch(() => { DL = false; document.body.classList.add('no-dl'); });
  }
  async function saveFile(filename, data) {
    if (inViewer) {
      if (!DL) { toast('이 화면에서는 파일 저장을 쓸 수 없습니다. ‘내용 복사’로 Word에 붙여넣으세요.'); return; }
      try { const r = await DL.save({ filename, data }); if (r && r.status === 'saved') toast('저장했습니다: ' + filename); }
      catch (e) { const c = e && e.code; if (c === 'declined') toast('저장을 취소했습니다.'); else if (c === 'rate_limited') toast('저장 창이 이미 열려 있습니다. 잠시 뒤 다시 누르세요.'); else toast('이 화면에서는 저장할 수 없습니다. ‘내용 복사’를 쓰세요.'); }
      return;
    }
    try { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: 'text/plain;charset=utf-8' })); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('저장했습니다: ' + filename); }
    catch (e) { toast('저장하지 못했습니다. ‘내용 복사’를 쓰세요.'); }
  }

  async function copyText(text, btn) {
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
    if (!ok) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove();
    }
    if (btn) { const s = btn.querySelector('span'); if (s) { const o = s.textContent; s.textContent = ok ? '복사됨' : '직접 선택해 복사'; btn.classList.toggle('done', ok); setTimeout(() => { s.textContent = o; btn.classList.remove('done'); }, 1600); } }
    if (!ok) toast('복사가 막혀 있습니다. 상자 안 글자를 드래그해 복사하세요.');
  }
  let toastT = null;
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }

  /* ---------- 화면 그리기 ---------- */
  let VIEW = 'start';
  function route() {
    const h = (location.hash || '').replace('#', '');
    const m = /^pg(\d+)$/.exec(h);
    if (m) { goPage(+m[1]); return; }
    VIEW = PARTS.some((p) => p.id === h) ? h : 'start';
    render(); window.scrollTo(0, 0);
  }
  function render() {
    BUF = new Map(); bufN = 0;
    $('#main').innerHTML = R[VIEW]();
    hydrate(); refresh();
    $$('#rail a[data-part], #strip a[data-part]').forEach((a) => a.classList.toggle('on', a.dataset.part === VIEW));
    $$('.tsw button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.track === TR ? 'true' : 'false'));
  }
  function hydrate() {
    $$('[data-k]', $('#main')).forEach((el) => {
      const v = store.get(el.dataset.k, '');
      if (el.type === 'checkbox') el.checked = v === '1';
      else if (el.type === 'radio') el.checked = v === el.value;
      else el.value = v;
    });
  }
  function refresh() {
    const p1 = $('#p1live'); if (p1) p1.innerHTML = ph(buildP1());
    const bl = $('#brieflive'); if (bl) { const t = buildBrief(); bl.innerHTML = ph(t); }
    const ol = $('#ollive'); if (ol) ol.textContent = buildOL();
    const pr = $('#pathres'); if (pr) { const v = pathVerdict(); pr.className = 'pathres ' + v.cls; pr.textContent = v.t; }
    $$('[data-fname]').forEach((el) => { const n = el.dataset.fname; el.textContent = fname(isNaN(+n) ? n : +n); });
    $$('[data-outstate]').forEach((el) => { const n = el.dataset.outstate; el.textContent = store.get('done' + n) === '1' ? '제출함' : ''; el.closest('.out').classList.toggle('done', store.get('done' + n) === '1'); });
    $$('#rail [data-done]').forEach((el) => { el.classList.toggle('done', store.get('done' + el.dataset.done) === '1'); });
    const c = $('[data-count="P8"]'); if (c) { const n = (store.get(`pe:P8:${TR}`, '') || ptext('P8')).length; c.textContent = `${n.toLocaleString()}자 / 8,000자`; c.classList.toggle('over', n > 8000); }
  }
  function setTrack(id) {
    if (!TRACKS.some((t) => t.id === id)) return;
    TR = id; store.set('track', id); const y = window.scrollY; render(); window.scrollTo(0, y);
    toast(`${tr().name} 트랙으로 바꿨습니다. 프롬프트·예시가 모두 바뀌었습니다.`);
  }
  function goPage(n) {
    const ranges = { start: [1, 6], p1: [7, 9], p2: [10, 20], p3: [21, 27], p4: [28, 34], p5: [35, 53], p6: [54, 61], p7: [62, 68], ref: [69, 71] };
    const part = Object.keys(ranges).find((k) => n >= ranges[k][0] && n <= ranges[k][1]);
    if (!part) { toast('교재 쪽은 1~71 사이입니다.'); return; }
    if (VIEW !== part) { VIEW = part; render(); }
    if (location.hash !== '#' + part) history.replaceState(null, '', '#' + part);
    const blocks = $$('#main .block[data-page]');
    let target = blocks.find((b) => b.dataset.page.split(' ').includes(String(n)));
    if (!target) target = blocks.filter((b) => +b.dataset.page.split(' ')[0] <= n).pop() || blocks[0];
    if (target) { target.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); target.classList.add('flash'); setTimeout(() => target.classList.remove('flash'), 1600); }
  }

  /* ---------- 이벤트 ---------- */
  function onField(e) {
    const el = e.target; const k = el.dataset && el.dataset.k; if (!k) return;
    if (el.type === 'checkbox') store.set(k, el.checked ? '1' : '0');
    else if (el.type === 'radio') { if (el.checked) store.set(k, el.value); }
    else store.set(k, el.value);
    if (k.startsWith('done')) $$(`[data-k="${k}"]`).forEach((x) => { x.checked = el.checked; });
    refresh();
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', (e) => {
    if (e.target.name === 'trackpick') { setTrack(e.target.value); return; }
    if (e.target.dataset && e.target.dataset.k) onField(e);
  });

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    const P = b.closest('.prompt');
    if (act === 'copy') { const live = b.dataset.live && $('#' + b.dataset.live); await copyText(live ? live.textContent : BUF.get(b.dataset.buf) || '', b); }
    else if (act === 'copy-live') { await copyText($('#' + b.dataset.live).textContent, b); }
    else if (act === 'copy-prompt') { const id = P.dataset.pid; const ed = P.querySelector('.pedit'); await copyText(!ed.hidden ? ed.value : (store.get(`pe:${id}:${TR}`, '') || ptext(id)), b); }
    else if (act === 'edit-prompt') {
      const id = P.dataset.pid; const ed = P.querySelector('.pedit'); const pre = P.querySelector('.pbody'); const s = b.querySelector('span');
      if (ed.hidden) { ed.value = store.get(`pe:${id}:${TR}`, '') || ptext(id); ed.hidden = false; pre.hidden = true; ed.style.height = Math.min(640, pre.scrollHeight + 40) + 'px'; s.textContent = '저장'; ed.focus(); }
      else { const v = ed.value; if (v.trim() && v !== ptext(id)) store.set(`pe:${id}:${TR}`, v); else store.del(`pe:${id}:${TR}`); P.outerHTML = promptBlock(id, P.querySelector('.pid').textContent, { count: id === 'P8' }); refresh(); toast('고쳐 쓴 판을 저장했습니다(이 브라우저).'); }
    }
    else if (act === 'reset-prompt') { const id = P.dataset.pid; store.del(`pe:${id}:${TR}`); P.outerHTML = promptBlock(id, P.querySelector('.pid').textContent, { count: id === 'P8' }); refresh(); }
    else if (act === 'set-track') setTrack(b.dataset.track);
    else if (act === 'timer') timerStart(+b.dataset.min, b.dataset.label);
    else if (act === 'fill-p3') {
      const r = A2DATA[TR].rows[+b.dataset.row]; let text = store.get(`pe:P3:${TR}`, '') || ptext('P3');
      const slots = text.match(/\{[^{}\n]+\}/g) || [];
      if (slots[0]) text = text.replace(slots[0], r[1]); if (slots[1]) text = text.replace(slots[1], r[2]);
      $('#p3fill').innerHTML = staticPrompt('P3', `${r[0]}번을 넣은 프롬프트`, 'Copilot Chat 새 채팅 · 표 6-4 운영 기준을 함께 붙여넣기', text) + `<p class="hint">강사용 정답: ${esc(r[3])}</p>`;
      $('#p3fill').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    else if (act === 'ws-example') { const i = b.dataset.i; const el = $('#f-ws' + i); if (el.value.trim() && !b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = '덮어쓰기?'; setTimeout(() => { b.classList.remove('armed'); b.textContent = '예시 넣기'; }, 2500); return; } el.value = WS[TR][i]; store.set('ws' + i, el.value); b.classList.remove('armed'); b.textContent = '예시 넣기'; el.focus(); }
    else if (act === 'quiz') {
      let score = 0;
      QUIZ.forEach((q, i) => { const v = store.get('quiz' + i, ''); const ok = v === q[1]; if (ok) score++; const r = $('#qres' + i); r.className = 'qres ' + (ok ? 'ok' : 'bad'); r.textContent = ok ? '정답' : `정답: ${q[1]} — ${q[2]}`; });
      $('#qscore').textContent = `${score} / 8 정답 · ${score >= 6 ? '성공' : '6장 이상이면 성공. 틀린 카드의 판단 근거를 확인하세요'}`;
    }
    else if (act === 'autofill') {
      const t = tr();
      const fixed = [0, 1, 2, 3, 4].find((r) => val(`trec_${r}_4`));
      const failed = [0, 1, 2, 3, 4].filter((r) => /실패|부분/.test(val(`trec_${r}_2`)));
      const guess = [
        [val('ws0'), t.reuse ? `1차시: ${t.reuse}` : ''].filter(Boolean).join('\n'),
        t.user,
        [val('ws1') || t.agent, buildOL()].join('\n'),
        ['지식: ' + (val('ws3') || t.know), '지침: ' + (val('ws4') || '(P8)'), '추천 프롬프트: ' + (val('ws5') || P9[TR].map((p) => p[0]).join(', '))].join('\n'),
        fixed != null ? `T${fixed + 1}(${TEST_TYPES[fixed]}) ${val(`trec_${fixed}_2`) || ''} → 수정: ${val(`trec_${fixed}_4`)} → 재시험 ${val(`trec_${fixed}_5`) || ''}` : '',
        [val('elabel') || '[설계 대체]', val('api0'), val('api5') ? '사람 확인: ' + val('api5') : ''].filter(Boolean).join(' · '),
        [val('f2_0_0'), val('f2_1_0')].filter(Boolean).join(' · '),
        [failed.length ? '실패·부분 원인: ' + failed.map((x) => `T${x + 1} ${val(`trec_${x}_3`) || ''}`).join(', ') : '', val('retro3')].filter(Boolean).join(' · '),
        `${BRIEF[TR][0]} · AI 생성 이미지(Microsoft Copilot), 생성일 ${val('bdate') || 'YYYY-MM-DD'}`,
      ];
      let filled = 0;
      guess.forEach((g, i) => { const el = $('#f-sum' + i); if (el && !el.value.trim() && g && g.trim()) { el.value = g; store.set('sum' + i, g); filled++; } });
      toast(filled ? `빈 칸 ${filled}개를 채웠습니다. 2~3줄로 다듬으세요.` : '채울 빈 칸이 없거나, 아직 불러올 내용이 없습니다.');
    }
    else if (act === 'export' || act === 'export-copy') {
      const n = b.dataset.out; const key = isNaN(+n) ? n : +n;
      if (key === 3) { const txt = imageTxt(); if (act === 'export') await saveFile(fname(3), txt); else await copyText(txt, b); return; }
      const D = buildDoc(key);
      if (act === 'export') await saveFile(fname(key), makeDocx(D)); else await copyText(docText(D), b);
    }
    else if (act === 'know' || act === 'know-copy') {
      const K = knowDoc(b.dataset.doc);
      if (act === 'know') await saveFile(K.fn, makeDocx(K.doc)); else await copyText(docText(K.doc), b);
    }
    else if (act === 'tpause') timerPause();
    else if (act === 'tclose') { store.del('timer'); renderTimer(); }
    else if (act === 'go-now') { const n = $('#now'); if (n.dataset.page) goPage(+n.dataset.page); }
  });

  $('#jump').addEventListener('submit', (e) => { e.preventDefault(); const n = parseInt($('#jumpn').value, 10); if (n) goPage(n); });
  window.addEventListener('hashchange', route);

  /* 레일·스트립 */
  const railHtml = PARTS.map((p) => `<a href="#${p.id}" data-part="${p.id}"><span class="rno">${p.no || '·'}</span><span class="rt"><b>${esc(p.title)}</b><small>${p.time || esc(p.sub)}</small></span></a>`).join('');
  $('#rail').innerHTML = `<nav aria-label="Part 목록">${railHtml}</nav><div class="rail-outs"><b>내 결과물</b>${OUTPUTS.map((o) => `<a href="#${o.part}" data-done="${o.n}" class="${o.min ? 'min' : ''}"><span>${'①②③④⑤⑥⑦⑧⑨'[o.n - 1]}</span>${esc(o.name)}</a>`).join('')}<small>제출하면 Part 7 회고 체크리스트에서 체크합니다</small></div>`;
  $('#strip').innerHTML = PARTS.map((p) => `<a href="#${p.id}" data-part="${p.id}">${p.no ? p.no + ' ' : ''}${esc(p.title)}</a>`).join('');
  $('#tsw').innerHTML = TRACKS.map((t) => `<button type="button" data-track="${t.id}" data-act="set-track" aria-pressed="${t.id === TR}">${t.name}</button>`).join('');

  route(); updateNow(); setInterval(updateNow, 30000); renderTimer();
})();

</script>

</body></html>
